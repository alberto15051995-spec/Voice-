name: Compilar Lilith Voice APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Descargar modelo español libre
        run: |
          curl -fL --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          mkdir -p /tmp/vosk-unpack app/src/main/assets/model-es
          unzip -q /tmp/model.zip -d /tmp/vosk-unpack
          cp -R /tmp/vosk-unpack/vosk-model-small-es-0.42/. app/src/main/assets/model-es/
          test -d app/src/main/assets/model-es/am
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LilithVoice-Offline-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
